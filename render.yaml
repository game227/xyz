databases:
  - name: xyz-db
    plan: free

services:
  - type: web
    name: xyz
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: BEHIND_PROXY
        value: "True"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: xyz-db
          property: connectionString
